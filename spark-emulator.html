<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book Warehouse | Spark emulator</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="shared.css"></head>
<body>
<header class="shared-header wrap"><a href="index.html">Book Warehouse</a><div class="language-switch" role="group" aria-label="Language / ভাষা"><button type="button" data-locale="bn" lang="bn">বাংলা</button><button type="button" data-locale="en" lang="en">English</button></div></header>
<main class="wrap shared-main">
<h1 id="shared-title"></h1><p id="shared-label" class="storage-notice"></p>
<button id="google-sign-in" type="button" class="button button-dark"></button><button id="cancel-sign-in" type="button" class="button button-outline" hidden></button><button id="retry-sign-in" type="button" class="button button-outline" hidden></button>
<details class="test-account-access"><summary id="test-accounts-label"></summary><form id="sign-in" class="shared-sign-in"><label><span id="email-label"></span><input name="email" type="email" autocomplete="username"></label><label><span id="password-label"></span><input name="password" type="password" autocomplete="current-password"></label><button type="submit" class="button button-dark" id="sign-in-button"></button></form></details>
<div class="shared-account" id="shared-account" hidden><span id="account-name"></span><button id="sign-out" type="button" class="button button-outline"></button></div>
<p id="shared-feedback" role="status" aria-live="polite"></p><button id="retry-command" class="button button-outline" type="button" hidden></button>
<section id="profile-section" aria-labelledby="profile-heading"><h2 id="profile-heading"></h2><p id="profile-note"></p><form id="profile-form" class="shared-profile" hidden><label for="profile-name" id="profile-name-label"></label><div class="profile-controls"><input id="profile-name" name="displayName" type="text" autocomplete="name" maxlength="120" required><button id="profile-save" type="submit" class="button button-dark"></button></div></form></section>
<section id="confirmation" class="borrow-confirm" aria-labelledby="confirmation-heading" hidden><h2 id="confirmation-heading"></h2><p id="confirmation-copy"></p><p id="confirmation-library"></p><p id="confirmation-reader"></p><label><span id="whatsapp-label"></span><input id="whatsapp" type="tel" autocomplete="tel" placeholder="+8801XXXXXXXXX"></label><p id="whatsapp-help"></p><button id="confirm-request" type="button" class="button button-dark"></button><button id="cancel-selection" type="button" class="button button-outline"></button></section>
<section aria-labelledby="catalogue-heading"><h2 id="catalogue-heading"></h2><div class="shared-filters"><label><span id="search-label"></span><input id="shared-search" type="search"></label><label><span id="library-label"></span><select id="shared-library"><option value="all"></option></select></label><label><span id="availability-label"></span><select id="shared-availability"><option value="all"></option><option value="available"></option></select></label></div><div id="shared-catalogue" class="book-grid"></div></section>
<section id="reader-section" aria-labelledby="requests-heading" hidden><h2 id="requests-heading"></h2><div id="shared-requests" class="request-list"></div></section>
<section id="operator-section" aria-labelledby="operator-heading" hidden><h2 id="operator-heading"></h2><div id="operator-requests" class="request-list"></div></section>
<section id="super-section" aria-labelledby="super-heading" hidden><h2 id="super-heading"></h2><div class="shared-filters"><label><span id="super-library-label"></span><select id="super-library"><option value="all"></option></select></label><label><span id="super-state-label"></span><select id="super-state"><option value="all"></option><option value="requested"></option><option value="ready"></option><option value="borrowed"></option><option value="returned"></option><option value="cancelled"></option></select></label></div><div id="super-requests" class="request-list"></div></section>
</main><script type="module" src="shared-app.js"></script></body></html>
